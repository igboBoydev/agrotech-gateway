server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: webflux-grpc-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  codec:
    max-in-memory-size: 2MB

grpc:
  client:
    host: ${GRPC_HOST:localhost}
    port: ${GRPC_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
